<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tech Zone</title>
    <style>
      :root { --bg:#04070a; --blue:#1ebdff; --text:#edf8ff; }
      *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:radial-gradient(circle at 20% 12%,rgba(30,189,255,.22),transparent 17%),radial-gradient(circle at 78% 18%,rgba(30,189,255,.18),transparent 18%),radial-gradient(circle at 54% 72%,rgba(30,189,255,.14),transparent 24%),var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;} body{position:relative;overflow-x:hidden} body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 60%,rgba(30,189,255,.5),transparent 16%),radial-gradient(circle at 52% 28%,rgba(30,189,255,.45),transparent 16%),radial-gradient(circle at 82% 70%,rgba(30,189,255,.42),transparent 18%);filter:blur(45px);opacity:.8}.page{position:relative;z-index:1;max-width:1500px;margin:0 auto;min-height:100vh;padding:30px 26px 24px}.hero{display:flex;align-items:center;justify-content:space-between;gap:26px}.console-wrap{flex:1;min-height:640px;display:flex;align-items:end;justify-content:center}.console{position:relative;width:min(560px,88%);height:560px;background:linear-gradient(180deg,#11171d 0%,#090d12 22%,#070b10 100%);border-radius:24px 24px 18px 18px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.08),0 0 22px rgba(30,189,255,.12);overflow:hidden}.console::before{content:"";position:absolute;inset:30px 40px 24px 40px;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));border:1px solid rgba(255,255,255,.05)}.sony{position:absolute;left:58px;top:104px;font-size:20px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.75);writing-mode:vertical-rl;transform:rotate(180deg)}.ps4-mark{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:172px;height:172px;border-radius:50%;background:rgba(255,255,255,.04);box-shadow:inset 0 0 18px rgba(255,255,255,.04)}.ps4-mark::before,.ps4-mark::after{content:"";position:absolute;inset:0;margin:auto}.ps4-mark::before{width:90px;height:90px;border:12px solid rgba(255,255,255,.9);border-radius:26px;transform:rotate(45deg)}.ps4-mark::after{width:54px;height:54px;border:12px solid rgba(255,255,255,.9);border-radius:16px;transform:rotate(45deg)}.controller{position:absolute;left:50%;bottom:30px;width:420px;height:200px;transform:translateX(-50%);border-radius:56% 56% 48% 48% / 52% 52% 48% 48%;background:linear-gradient(145deg,#11171d 0%,#090d12 65%);border:1px solid rgba(255,255,255,.08);box-shadow:0 0 18px rgba(30,189,255,.08), inset 0 0 16px rgba(255,255,255,.03)}.controller::before,.controller::after{content:"";position:absolute;top:42px;width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.12), rgba(0,0,0,.4) 42%, rgba(0,0,0,.75) 100%);border:12px solid rgba(255,255,255,.06)}.controller::before{left:52px}.controller::after{right:52px}.dpad{position:absolute;left:118px;top:68px;width:84px;height:84px;border-radius:18px;background:rgba(255,255,255,.02)}.dpad::before,.dpad::after{content:"";position:absolute;background:#1a1f25;border-radius:8px}.dpad::before{left:50%;top:8px;width:20px;height:68px;transform:translateX(-50%)}.dpad::after{top:50%;left:8px;width:68px;height:20px;transform:translateY(-50%)}.actions{position:absolute;right:92px;top:52px;display:flex;gap:14px}.actions span{display:block;width:40px;height:40px;border-radius:50%;background:#0d1117;box-shadow:inset 0 0 0 2px rgba(255,255,255,.04)}.brand{flex:1;min-width:420px}.brand-row{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:12px}.brand-mark{position:relative;width:76px;height:76px;border-radius:18px;background:rgba(18,24,30,.8);box-shadow:inset 0 0 0 2px rgba(30,189,255,.8),0 0 16px rgba(30,189,255,.18)}.brand-mark::before{content:"";position:absolute;inset:18px 16px 18px 16px;border:8px solid var(--blue);border-radius:18px;transform:rotate(45deg)}.brand-mark::after{content:"";position:absolute;left:50%;top:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);background:var(--blue)}.tech-title{position:relative;font-size:clamp(3.1rem,5vw,6.2rem);font-weight:900;letter-spacing:.08em;text-transform:uppercase;line-height:.9;text-align:center;color:#f2f9ff;text-shadow:0 0 2px rgba(255,255,255,.8),0 0 10px rgba(30,189,255,.72),0 0 28px rgba(30,189,255,.28)}.tech-title::before{content:"";position:absolute;left:0;right:0;top:50%;height:4px;background:linear-gradient(90deg,transparent,rgba(30,189,255,.9),transparent);transform:translateY(-50%)}.subtitle{margin:18px 0 6px;text-align:center;font-size:clamp(1.4rem,2vw,2rem);font-weight:700;color:#f3f9ff}.ps4-row{display:flex;align-items:center;justify-content:center;gap:18px;margin:22px 0 26px}.ps4-icon{position:relative;width:110px;height:90px}.ps4-icon::before,.ps4-icon::after{content:"";position:absolute;bottom:18px;width:104px;height:64px;border:7px solid var(--blue);border-bottom:0;border-radius:14px 14px 0 0}.ps4-icon::before{left:0;transform:skewX(-18deg)}.ps4-icon::after{right:0;transform:skewX(18deg)}.ps4-name{font-size:clamp(3.7rem,7vw,7rem);font-weight:800;letter-spacing:.05em;color:#edf8ff;text-shadow:0 0 12px rgba(30,189,255,.72),0 0 26px rgba(30,189,255,.26)}.feature-grid{display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));gap:18px}.feature{padding:20px 14px 16px;border:2px solid rgba(30,189,255,.75);border-radius:12px;background:rgba(7,12,18,.45);box-shadow:inset 0 0 16px rgba(30,189,255,.08),0 0 10px rgba(30,189,255,.1);text-align:center}.feature-icon{position:relative;width:82px;height:82px;margin:0 auto 14px}.icon-game::before{content:"";position:absolute;inset:14px 12px 18px 12px;border:5px solid var(--blue);border-radius:12px}.icon-game::after{content:"";position:absolute;left:50%;top:50%;width:38px;height:38px;border:5px solid var(--blue);border-radius:50%;transform:translate(-50%,-50%)}.icon-wrench::before{content:"";position:absolute;left:50%;top:18px;width:28px;height:28px;border:5px solid var(--blue);border-radius:50%;transform:translateX(-50%)}.icon-wrench::after{content:"";position:absolute;left:50%;top:44px;width:58px;height:18px;border:5px solid var(--blue);border-radius:12px;transform:translateX(-50%) rotate(30deg)}.icon-download::before{content:"";position:absolute;left:50%;top:18px;width:42px;height:42px;border:5px solid var(--blue);border-radius:50% 50% 50% 0;transform:translateX(-50%) rotate(-45deg)}.icon-download::after{content:"";position:absolute;left:50%;bottom:12px;width:12px;height:28px;background:var(--blue);transform:translateX(-50%)}.feature-title{display:block;font-size:1.08rem;font-weight:700;line-height:1.5;color:#ebf8ff}.bottom{display:flex;align-items:center;justify-content:center;gap:30px;margin-top:34px}.bottom-title{font-size:clamp(2.8rem,5vw,5.2rem);font-weight:900;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 0 10px rgba(30,189,255,.65),0 0 26px rgba(30,189,255,.24)}.phone{display:flex;align-items:center;gap:12px;font-size:clamp(1.2rem,1.9vw,2.3rem);font-weight:700}.phone .icon{width:30px;height:30px;border-radius:50%;border:4px solid var(--blue);position:relative}.phone .icon::before{content:"";position:absolute;left:50%;top:50%;width:10px;height:14px;border-radius:8px;background:var(--blue);transform:translate(-50%,-50%)}.devices{display:flex;align-items:center;gap:12px}.device{position:relative;width:72px;height:72px;border:2px solid rgba(255,255,255,.8);border-radius:12px;background:rgba(10,15,18,.35)}.device.xbox::after{content:"X";position:absolute;inset:0;display:grid;place-items:center;font-size:2.3rem;font-weight:900;color:var(--blue)}.device.pc::before{content:"";position:absolute;left:50%;top:50%;width:40px;height:24px;border:5px solid var(--blue);border-radius:8px;transform:translate(-50%,-50%)}.device.pc::after{content:"";position:absolute;left:50%;bottom:10px;width:46px;height:7px;transform:translateX(-50%);background:rgba(255,255,255,.7)}@media (max-width:980px){.hero{flex-direction:column}.brand{min-width:0}}@media (max-width:660px){.page{padding-left:14px;padding-right:14px}.console{height:470px}.controller{width:280px;height:150px}.feature-grid{grid-template-columns:1fr}.bottom{flex-direction:column;text-align:center}}</style>
  </head>
  <body>
    <div class="page">
      <div class="hero">
        <div class="console-wrap">
          <div class="console" aria-label="Console PS4">
            <div class="sony">SONY</div>
            <div class="ps4-mark" aria-hidden="true"></div>
            <div class="controller" aria-hidden="true">
              <div class="dpad"></div>
              <div class="actions"><span></span><span></span></div>
            </div>
          </div>
        </div>
        <div class="brand">
          <div class="brand-row">
            <div class="brand-mark" aria-hidden="true"></div>
            <div class="tech-title">Tech Zone</div>
          </div>
          <div class="subtitle">كل ما يخص الألعاب والتقنية</div>
          <div class="ps4-row">
            <div class="ps4-icon" aria-hidden="true"></div>
            <div class="ps4-name">PS4</div>
          </div>
          <div class="feature-grid">
            <div class="feature"><div class="feature-icon icon-game" aria-hidden="true"></div><span class="feature-title">متوفر تنزيل<br>ألعاب</span></div>
            <div class="feature"><div class="feature-icon icon-wrench" aria-hidden="true"></div><span class="feature-title">تعديل على<br>البلايستيشن</span></div>
            <div class="feature"><div class="feature-icon icon-download" aria-hidden="true"></div><span class="feature-title">أحدث الألعاب<br>جاهزة</span></div>
          </div>
        </div>
      </div>
      <div class="bottom">
        <div class="bottom-title">Tech Zone</div>
        <div class="phone"><span class="icon" aria-hidden="true"></span><span>0921720500</span></div>
        <div class="devices" aria-label="Platforms"><div class="device xbox" aria-hidden="true"></div><div class="device pc" aria-hidden="true"></div></div>
      </div>
    </div>
  </body>
</html>
